<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgetting System</title>
    
</head>
<body>
    <h1>QRipot</h1>
    <br>
    <a href="transaction_history.html">View Transaction History</a>
    <br><br>
    <p>Welcome Back! your current balance is: <span id="balance"></span> / <span id="limit"></span></p>

    <!--this is for the user to input whether they received an income or an expense. -->
    <!--Category means what income or expense is it, for example, salary, food, etc. -->
    <!-- Amount is how much money received or spent, and description allows the user to add a note -->

<form id="addincomeForm">

     <label>Category:</label>
    <select id="category" required>
        <option value="Allowance">Allowance</option>
        <option value="Pocket Money">Pocket Money</option>
        <option value="Salary">Salary</option>
    </select>

    <br><br>

    <label>Amount:</label>
    <input type="number" id="amount" min="0.01" step="0.01" required>

    <br><br>

    <label>Description:</label>
    <input type="text" id="description" required>

    <br><br>

    <label>Select Date:</label>
    <input type="date" id="date" name="date">

    <br><br>

    <button type="submit">Add Income</button>
    <br>
</form>

<form id="addexpenseForm">

     <label>Category:</label>
    <select id="category" required>
        <option value="Food and Drinks">Food and Drinks</option>
        <option value="Transportation">Transportation</option>
        <option value="Personal Needs">Personal Needs</option>
        <option value="Utilities">Utilities</option>
        <option value="Savings">Savings</option>
    </select>

    <br><br>

    <label>Amount:</label>
    <input type="number" id="amount" min="0.01" step="0.01" required>

    <br><br>

    <label>Description:</label>
    <input type="text" id="description" required>

    <br><br>

    <label>Select Date:</label>
    <input type="date" id="date" name="date">
    
    <br><br>

    <button type="submit">Add Expense</button>
</form>



</body>
<script src="alljs.js" defer></script>
</html>
